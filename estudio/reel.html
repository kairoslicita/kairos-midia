<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--paper:#f2ede3;--forest:#0b2219;--forest2:#10291f;--coral:#ff5f3c;--lime:#b9ee4f;--mut:#8fa699}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b2219}
body{font-family:'Inter',sans-serif;color:#f1ede4;position:relative}
.mono{font-family:'DejaVu Sans Mono',monospace}
.D{font-family:'Inter Display';font-weight:900;letter-spacing:-.045em;line-height:.92}
.L{position:absolute;left:80px;right:80px}
.phone{position:absolute;width:430px;height:880px;border-radius:66px;background:#0a0f0d;padding:14px;box-shadow:0 60px 120px -30px rgba(0,0,0,.7),0 0 0 2px #26302b inset;transform-origin:top left}
.screen{width:100%;height:100%;border-radius:54px;background:#0e271d;overflow:hidden;position:relative;color:#f1ede4}
.island{position:absolute;left:50%;top:14px;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:#000;z-index:5}
.row{display:flex;align-items:center;gap:10px;background:#123024;border:1px solid #24463a;border-radius:14px;padding:11px 12px;font-size:13.5px}
.row .tm{font-family:'DejaVu Sans Mono';font-size:11.5px;color:var(--mut);width:62px}.row .tx{flex:1}
.pill{font-family:'DejaVu Sans Mono';font-size:11px;padding:4px 9px;border-radius:999px}
.pl{background:rgba(255,95,60,.18);color:#ff8a6d}.pw{background:rgba(185,238,79,.18);color:var(--lime)}.ph{background:rgba(241,237,228,.12);color:#cfd8cf}
.toast{position:absolute;background:rgba(241,237,228,.97);color:#0b2219;border-radius:30px;padding:20px 24px;display:flex;gap:16px;align-items:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.toast .ap{width:58px;height:58px;border-radius:14px;background:#0b2219;color:#f2ede3;font-family:'Inter Display';font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.toast .ap b{color:var(--coral)}
.toast h6{font-size:22px;font-weight:700}.toast p{font-size:21px;color:#3b4a42;margin-top:2px}
</style></head><body><div id="root"></div>
<script>
const root=document.getElementById('root');
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const fmt=v=>'R$ '+v.toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const blink=t=>(Math.floor(t*2)%2)?1:.25;
const SC=[[0,3.2],[3.2,7.0],[7.0,11.0],[11.0,14.6],[14.6,17.4],[17.4,21.5]];
const wrap=(lt,len,html)=>{const a=ease(lt/.3), o=lt>len-.2?1-clamp((lt-(len-.2))/.2):1;return `<div style="position:absolute;inset:0;opacity:${a*o};transform:translateY(${(1-a)*50}px)">${html}</div>`};
const bg=(c)=>`<div style="position:absolute;inset:0;background:radial-gradient(80% 45% at 50% 55%,${c},rgba(0,0,0,0) 70%),#0b2219"></div>`;
const logo=`<div style="position:absolute;left:80px;top:150px;font-family:'Inter Display';font-weight:800;font-size:42px;letter-spacing:-.03em">Kairos<b style="color:#ff5f3c">.</b></div>`;

function s1(lt){ // reunião
  const sec=Math.floor(lt*4)%60; const n=ease((lt-1.6)/.35);
  return bg('rgba(255,95,60,.14)')+logo+`
  <div class="L D" style="top:300px;font-size:132px">Reunião<br>às 9h.</div>
  <div class="L D" style="top:560px;font-size:132px;color:#ff5f3c;opacity:${ease((lt-.6)/.3)}">Pregão<br>também.</div>
  <div class="L mono" style="top:900px;font-size:200px;letter-spacing:-.05em;color:#f1ede4">08:59<span style="color:#8fa699;font-size:110px">:${String(sec).padStart(2,'0')}</span></div>
  <div class="toast" style="left:80px;right:80px;top:${1230+(1-n)*-60}px;opacity:${n}"><div class="ap">K<b>.</b></div><div><h6>Compras.gov.br · disputa aberta</h6><p>Item 1: impressora multifuncional</p></div></div>`;
}
function s2(lt){ // concorrente baixa
  const st=[[0,1312.40],[0.9,1301.00],[1.8,1289.90],[2.7,1279.90]]; let best=st[0][1],since=lt,idx=0; st.forEach((s,i)=>{if(lt>=s[0]){best=s[1];since=lt-s[0];idx=i}});
  const flash=Math.max(0,1-since/.35); const shake=flash>0?Math.sin(lt*90)*8*flash:0;
  return bg('rgba(255,95,60,.25)')+`
  <div class="L D" style="top:250px;font-size:120px">O concorrente<br><span style="color:#ff5f3c">baixou ${idx} ${idx===1?'vez':'vezes'}.</span></div>
  <div style="position:absolute;left:80px;right:80px;top:620px;height:720px;border-radius:52px;background:#ff5f3c;color:#1a0f0a;padding:54px 56px;transform:translateX(${shake}px) scale(${1+flash*.015});box-shadow:0 50px 110px -30px rgba(255,95,60,.6)">
   <div class="mono" style="font-size:30px;letter-spacing:.08em">ITEM 1 · PERDENDO</div>
   <div class="D" style="font-weight:800;font-size:100px;margin-top:34px;line-height:.98">Cobrir item 1<br>com ${fmt(best-0.10)}.</div>
   <div style="position:absolute;left:56px;right:56px;bottom:54px"><div style="font-size:26px;opacity:.85">melhor lance do concorrente</div>
   <div class="mono" style="font-size:118px;letter-spacing:-.03em;transform:scale(${1+flash*.06});transform-origin:left bottom">${fmt(best)}</div></div>
  </div>
  <div class="L" style="top:1400px;font-size:36px;color:#cfd8cf">E você, na reunião.</div>`;
}
function s3(lt){ // robô cobre
  const rows=[[0.5,'08:59:41','Cobriu: R$ 1.301,00 → 1.300,90','cobriu','pw'],[1.4,'08:59:47','Cobriu: R$ 1.289,90 → 1.289,80','cobriu','pw'],[2.3,'08:59:52','Cobriu: R$ 1.279,90 → 1.279,80','cobriu','pw']];
  const vis=rows.filter(r=>lt>=r[0]); const cur=vis.length?vis[vis.length-1]:null;
  const val=[1312.30,1300.90,1289.80,1279.80][vis.length];
  const inner=`<div class="island"></div><div style="display:flex;justify-content:space-between;padding:20px 34px 0;font-size:17px;font-weight:600"><span>08:59</span><span>5G ▮▮▮</span></div>
   <div style="display:flex;justify-content:space-between;align-items:center;padding:30px 24px 12px"><div style="font-family:'Inter Display';font-weight:700;font-size:24px">Robô de lances</div><div class="mono" style="font-size:13px;color:#b9ee4f">● ao vivo</div></div>
   <div style="margin:6px 16px;border-radius:24px;padding:20px;background:#123024;border:1px solid #24463a"><div class="mono" style="font-size:13px;color:#8fa699">SEU LANCE</div><div class="mono" style="font-size:44px;margin-top:10px;color:#b9ee4f">${fmt(val)}</div><div style="font-size:14px;color:#8fa699;margin-top:6px">variação mínima R$ 0,10</div></div>
   <div style="margin:14px 22px 8px;font-size:15px;font-weight:700">Log de atividades</div>
   <div style="margin:0 16px;display:flex;flex-direction:column;gap:8px">${vis.slice().reverse().map(r=>`<div class="row" style="opacity:${ease((lt-r[0])/.25)}"><span class="tm">${r[1]}</span><span class="tx">${r[2]}</span></div>`).join('')}</div>`;
  return bg('rgba(185,238,79,.12)')+`
  <div class="L D" style="top:250px;font-size:104px">O robô cobre<br><span style="color:#b9ee4f">em milissegundos.</span></div>
  <div class="phone" style="left:${540-430*1.25/2}px;top:580px;transform:scale(1.25)"><div class="screen">${inner}</div></div>`;
}
function s4(lt){ // limite
  const W=920,H=700,x0=80,y0=600; const lim=1166.67, top=1320, bot=1120;
  const Y=v=>y0+ (top-v)/(top-bot)*H;
  const pts=[1312.3,1301.0,1300.9,1289.9,1289.8,1279.9,1279.8]; const prog=clamp(lt/1.8)*(pts.length-1);
  let path='',dots=''; for(let i=0;i<=Math.floor(prog);i++){const x=x0+60+i*(W-160)/(pts.length-1),y=Y(pts[i]);path+=(i?'L':'M')+x+','+y;dots+=`<circle cx="${x}" cy="${y}" r="10" fill="${i%2?'#ff5f3c':'#b9ee4f'}"/>`;}
  const last=Math.floor(prog); const lx=x0+60+last*(W-160)/(pts.length-1), ly=Y(pts[last]);
  const gap=ease((lt-1.9)/.5);
  return bg('rgba(185,238,79,.10)')+`
  <div class="L D" style="top:250px;font-size:112px">Nunca abaixo<br><span style="color:#ff5f3c">do seu limite.</span></div>
  <svg width="1080" height="1920" style="position:absolute;inset:0">
   <line x1="${x0}" x2="${x0+W}" y1="${Y(lim)}" y2="${Y(lim)}" stroke="#ff5f3c" stroke-width="4" stroke-dasharray="14 10"/>
   <path d="${path}" stroke="#f1ede4" stroke-opacity=".6" stroke-width="4" fill="none"/>${dots}
   <line x1="${lx}" x2="${lx}" y1="${ly+16}" y2="${ly+16+(Y(lim)-ly-32)*gap}" stroke="#b9ee4f" stroke-width="4"/>
  </svg>
  <div class="mono" style="position:absolute;left:${x0}px;top:${Y(lim)+20}px;font-size:30px;color:#ff8a6d">seu limite: ${fmt(lim)}</div>
  <div style="position:absolute;left:${x0}px;top:${y0-10}px;font-size:28px;color:#8fa699"><span style="display:inline-block;width:16px;height:16px;border-radius:50%;background:#ff5f3c;margin-right:10px"></span>concorrente &nbsp;&nbsp;<span style="display:inline-block;width:16px;height:16px;border-radius:50%;background:#b9ee4f;margin:0 10px 0 20px"></span>robô</div>
  <div class="mono" style="position:absolute;left:${lx-420}px;top:${(ly+Y(lim))/2-30}px;width:560px;margin-left:-160px;white-space:nowrap;text-align:right;font-size:34px;color:#b9ee4f;opacity:${gap}">+ R$ 113,13 de margem</div>
  <div class="L" style="top:1420px;font-size:30px;color:#8fa699">Valores de exemplo.</div>`;
}
function s5(lt){ // ganhando
  const n=ease((lt-.6)/.35);
  return bg('rgba(185,238,79,.22)')+`
  <div style="position:absolute;left:80px;right:80px;top:260px;height:640px;border-radius:52px;background:#c9f26c;color:#0b2219;padding:54px 56px;box-shadow:0 50px 110px -30px rgba(185,238,79,.5)">
   <div class="mono" style="font-size:30px;letter-spacing:.08em">ITEM 1 · GANHANDO</div>
   <div class="D" style="font-weight:800;font-size:116px;margin-top:34px;line-height:.96">O robô cobriu.<br>Você lidera.</div>
   <div class="mono" style="position:absolute;left:56px;bottom:54px;font-size:110px;letter-spacing:-.03em">${fmt(1279.80)}</div></div>
  <div class="toast" style="left:80px;right:80px;top:${960-(1-n)*40}px;opacity:${n}"><div class="ap">K<b>.</b></div><div><h6>Kairos · item 1</h6><p>Ganhando, dentro do seu limite.</p></div></div>
  <div class="L D" style="top:1160px;font-size:96px;opacity:${ease((lt-1.0)/.3)}">E você nem saiu<br><span style="color:#ff5f3c">da reunião.</span></div>`;
}
function s6(lt){ // fim
  const p=1+0.025*Math.sin(lt*5);
  return bg('rgba(255,95,60,.18)')+`
  <div class="L" style="top:330px;font-family:'Inter Display';font-weight:800;font-size:120px;letter-spacing:-.04em">Kairos<b style="color:#ff5f3c">.</b></div>
  <div class="L D" style="top:520px;font-size:104px">Robô de lances<br>para o<br><span style="color:#b9ee4f">Compras.gov.br.</span></div>
  <div class="L" style="top:930px;font-size:36px;line-height:1.35;color:#cfd8cf">Você define o limite. Ele dá os lances.<br>Você acompanha pelo celular.</div>
  <div style="position:absolute;left:80px;top:1130px;background:#ff5f3c;color:#0b2219;border-radius:30px;padding:28px 40px;font-family:'Inter Display';font-weight:900;font-size:66px;letter-spacing:-.03em;transform:scale(${p});transform-origin:left center">Kit do Pregão grátis</div>
  <div class="L" style="top:1290px;font-size:32px;color:#cfd8cf">checklist + calculadora do preço mínimo, no link da bio.</div>
  <div class="L" style="top:1380px;font-size:32px;color:#f1ede4"><b>Teste grátis por 7 dias</b> · também na bio</div>`;
}
const F=[s1,s2,s3,s4,s5,s6];
window.render=t=>{let h='';SC.forEach((s,i)=>{if(t>=s[0]&&t<s[1])h=wrap(t-s[0],s[1]-s[0],F[i](t-s[0]))});root.innerHTML=h;};
render(0);
</script></body></html>
