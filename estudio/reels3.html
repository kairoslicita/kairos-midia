<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--forest:#0b2219;--coral:#ff5f3c;--lime:#b9ee4f;--mut:#8fa699}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b2219}
body{font-family:'Inter',sans-serif;color:#f1ede4;position:relative}
.mono{font-family:'DejaVu Sans Mono',monospace}
.D{font-family:'Inter Display';font-weight:900;letter-spacing:-.045em;line-height:.92}
.L{position:absolute;left:80px;right:80px}
.phone{position:absolute;width:430px;height:880px;border-radius:66px;background:#0a0f0d;padding:14px;box-shadow:0 60px 120px -30px rgba(0,0,0,.7),0 0 0 2px #26302b inset;transform-origin:top left}
.screen{width:100%;height:100%;border-radius:54px;background:#0e271d;overflow:hidden;position:relative;color:#f1ede4}
.island{position:absolute;left:50%;top:14px;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:#000;z-index:5}
.row{display:flex;align-items:center;gap:10px;background:#123024;border:1px solid #24463a;border-radius:14px;padding:11px 12px;font-size:13.5px}
.row .tm{font-family:'DejaVu Sans Mono';font-size:11.5px;color:var(--mut);width:62px}.row .tx{flex:1}
.toast{position:absolute;background:rgba(241,237,228,.97);color:#0b2219;border-radius:30px;padding:20px 24px;display:flex;gap:16px;align-items:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.toast .ap{width:58px;height:58px;border-radius:14px;background:#0b2219;color:#f2ede3;font-family:'Inter Display';font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.toast .ap b{color:var(--coral)}
.toast h6{font-size:22px;font-weight:700}.toast p{font-size:21px;color:#3b4a42;margin-top:2px}
.card{position:absolute;left:80px;right:80px;border-radius:48px;background:#123024;border:2px solid #24463a;padding:44px 48px}
.k{font-size:13px;color:#8fa699;font-family:'DejaVu Sans Mono';letter-spacing:.04em}
.box{margin:10px 16px;border-radius:20px;padding:14px 18px;background:#123024;border:1px solid #24463a}
.stamp{position:absolute;transform-origin:center;border:10px solid #ff5f3c;color:#ff5f3c;border-radius:24px;padding:10px 28px;font-family:'Inter Display';font-weight:900;letter-spacing:-.03em;background:rgba(11,34,25,.92)}
</style></head><body><div id="root"></div>
<script>
const MODE=(location.hash||'#r7').slice(1);
const root=document.getElementById('root');
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
const back=x=>{x=Math.max(0,Math.min(1,x));const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const fmt=v=>'R$ '+(+v).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const bg=(c)=>`<div style="position:absolute;inset:0;background:radial-gradient(80% 45% at 50% 50%,${c},rgba(0,0,0,0) 70%),#0b2219"></div>`;
const LIME='#b9ee4f', CORAL='#ff5f3c';
const tag=(t,c)=>`<div style="position:absolute;left:80px;top:150px;display:flex;gap:14px;align-items:center"><span style="font-family:'Inter Display';font-weight:800;font-size:40px;letter-spacing:-.03em">Kairos<b style="color:#ff5f3c">.</b></span><span class="mono" style="font-size:23px;letter-spacing:.05em;color:#0b2219;background:${c||LIME};border-radius:999px;padding:8px 18px">${t}</span></div>`;
const wrap=(lt,html,first)=>{const s=first?1:1.05-0.05*ease(lt/.22);return `<div style="position:absolute;inset:0;transform:scale(${s});transform-origin:50% 45%">${html}</div>`};
function head(lt,html,size,top,instant){
  if(instant) return `<div class="L D" style="top:${top}px;font-size:${size}px">${html}</div>`;
  let i=0; const out=html.replace(/(<[^>]+>)|([^<\s]+)/g,(m,tg,w)=>{ if(tg) return tg; const e=back((lt-i*.05)/.22); i++; return `<span style="display:inline-block;opacity:${clamp((lt-(i-1)*.05)/.08)};transform:translateY(${(1-e)*40}px)">${w}</span>`;});
  return `<div class="L D" style="top:${top}px;font-size:${size}px">${out}</div>`;
}
const note=(txt,top=1470,o=1)=>`<div class="L" style="top:${top}px;font-size:26px;line-height:1.4;color:#8fa699;opacity:${o}">${txt}</div>`;
const sb=tm=>`<div class="island"></div><div style="display:flex;justify-content:space-between;padding:20px 34px 0;font-size:17px;font-weight:600"><span>${tm}</span><span>5G ▮▮▮</span></div>`;
const phone=(inner,top,sc)=>`<div class="phone" style="left:${540-430*sc/2}px;top:${top}px;transform:scale(${sc})"><div class="screen">${inner}</div></div>`;
const ttl=(a,b,c)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:28px 24px 8px"><div><div style="font-family:'Inter Display';font-weight:700;font-size:24px">${a}</div>${b?`<div style="font-size:13.5px;color:#8fa699;margin-top:4px">${b}</div>`:''}</div>${c||''}</div>`;
const pill=(t,c,bgc)=>`<span class="mono" style="font-size:11.5px;color:${c};background:${bgc||'transparent'};border-radius:999px;padding:${bgc?'4px 9px':'0'}">${t}</span>`;
const fin=(lt,d)=>`opacity:${clamp((lt-d)/.15)};transform:translateY(${(1-ease((lt-d)/.3))*16}px)`;
// área segura do feed 4:5 (Boost)
const safe=(html)=>`<div style="position:absolute;inset:0;transform:translateY(180px) scale(.86);transform-origin:50% 150px">${html}</div>`;

/* ---------- telas reutilizáveis ---------- */
function cfgScreen(lt,tm,stopTxt,item){
  const n=Math.min(stopTxt.length,Math.floor(lt/.09)); const tg=ease((lt-1.55)/.3);
  return sb(tm)+ttl(item[0],item[1],pill('DISPUTA HOJE · 09:00','#0b2219',LIME))+`
   <div class="box" style="border:2px solid ${lt<1.55?LIME:'#24463a'};padding:18px 20px;margin-top:14px"><div class="k">STOP LOSS · SEU LIMITE</div><div class="mono" style="font-size:36px;margin-top:10px;white-space:nowrap">${stopTxt.slice(0,n)}<span style="color:${LIME};opacity:${Math.floor(lt*4)%2}">|</span></div></div>
   <div class="box"><div class="k">VARIAÇÃO MÍNIMA</div><div class="mono" style="font-size:26px;margin-top:6px">R$ 0,10</div></div>
   <div style="margin:22px 16px;border-radius:24px;padding:22px 24px;background:${tg>.5?LIME:'#1b3a2d'};color:${tg>.5?'#0b2219':'#8fa699'};display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:22px"><span>Robô ${tg>.5?'ligado':'desligado'}</span><span style="width:62px;height:34px;border-radius:20px;background:${tg>.5?'#0b2219':'#35514a'};position:relative"><span style="position:absolute;top:4px;left:${4+tg*28}px;width:26px;height:26px;border-radius:50%;background:${tg>.5?LIME:'#8fa699'}"></span></span></div>
   <div style="margin:10px 24px;font-size:14px;color:#8fa699;line-height:1.45">Roda no servidor. Pode bloquear o celular.</div>`;
}
function roboScreen(lt,o){
  const {t0,R,comp,stop,me0,cp0,tm}=o; let cp=cp0, me=me0, n=0, rows=[], lastT=-9, blocked=false;
  comp.forEach((c,i)=>{const tc=t0+i*R; if(lt>=tc){cp=c} if(lt>=tc+.3){ const s=`${tm}:${String(31+i*7).padStart(2,'0')}`;
    if(c-0.1>=stop-1e-9){me=c-0.1;n++;rows.push([tc+.3,s,`Cobriu: ${fmt(c)} → ${fmt(c-0.1)}`,'#f1ede4'])}
    else {blocked=true;rows.push([tc+.3,s,'Não cobriu: abaixo do stop loss','#ff8a6d'])}
    lastT=tc+.3 }});
  const fl=Math.max(0,1-(lt-lastT)/.3)*(rows.length?1:0); const win=me<cp-1e-9;
  const st=blocked?pill('NO SEU LIMITE','#ff8a6d'):win?pill('● GANHANDO',LIME):pill('● PERDENDO','#ff8a6d');
  const last=rows.slice(-4).reverse();
  return sb(tm)+ttl('Robô de lances','Item 1 · disputa ao vivo',st)+`
   <div class="box" style="border:1px solid ${fl>0&&!blocked?LIME:'#24463a'};padding:16px 20px"><div class="k">SEU LANCE</div><div class="mono" style="font-size:40px;margin-top:6px;color:${LIME};transform:scale(${1+fl*.05});transform-origin:left">${fmt(me)}</div></div>
   <div class="box" style="background:#2a1a14;border-color:#5a2e22;padding:12px 20px"><div class="k" style="color:#ff8a6d">CONCORRENTE</div><div class="mono" style="font-size:26px;margin-top:4px;color:#ff8a6d">${fmt(cp)}</div></div>
   <div class="box" style="border:2px dashed ${blocked?CORAL:'#3c5a4e'};display:flex;justify-content:space-between;align-items:center;padding:12px 20px"><span class="k">STOP LOSS</span><span class="mono" style="font-size:20px">${fmt(stop)}</span></div>
   <div style="display:flex;justify-content:space-between;margin:14px 24px 8px;font-size:15px;font-weight:700"><span>Log de atividades</span><span class="mono" style="color:${LIME};font-size:13px">${n} cobertos</span></div>
   <div style="margin:0 16px;display:flex;flex-direction:column;gap:7px">${last.map((r,i)=>`<div class="row" style="opacity:${i==0?ease((lt-r[0])/.15):1};color:${r[3]}"><span class="tm">${r[1]}</span><span class="tx">${r[2]}</span></div>`).join('')}</div>`;
}

/* ================= R7 · "Sua primeira dispensa ou pregão" (33 s) ================= */
const STEPS=[['1','Marcas','pesquise antes de ofertar'],['2','Documentos','validades à vista'],['3','Disputa','o robô no dia'],['4','Informação','tudo num só lugar']];
function g1(lt){
  // gancho: fundo coral (quebra o padrão do feed), frase inteira no quadro 0 e ranking em que "Você" sobe do 4º ao 1º
  const pz=1.05-0.05*ease(lt/.35);
  const up=ease((lt-.55)/.8), won=lt>=1.45, st=ease((lt-1.45)/.22), sh=lt>1.45&&lt<1.9?Math.sin(lt*85)*7*(1-(lt-1.45)/.45):0;
  const val=1320.00-(1320.00-1279.80)*up;
  const others=[['Fornecedor A','R$ 1.289,90'],['Fornecedor B','R$ 1.301,00'],['Fornecedor C','R$ 1.312,40']];
  const H=118, y0=0;
  const rows=others.map((o,i)=>`<div style="position:absolute;left:36px;right:36px;top:${y0+(i+up)*H}px;height:100px;display:flex;justify-content:space-between;align-items:center;padding:0 30px;border-radius:24px;background:#123024;font-size:38px;color:#cfd8cf"><span><b class="mono" style="color:#8fa699;margin-right:18px">${i+1+(up>.5?1:0)}º</b>${o[0]}</span><span class="mono" style="font-size:38px">${o[1]}</span></div>`).join('')+
   `<div style="position:absolute;left:36px;right:36px;top:${y0+(3-3*up)*H}px;height:100px;display:flex;justify-content:space-between;align-items:center;padding:0 30px;border-radius:24px;background:${won?LIME:'#2a1a14'};color:${won?'#0b2219':'#ff8a6d'};font-size:40px;font-weight:800;box-shadow:0 20px 40px -10px rgba(0,0,0,.5);transform:scale(${1+.04*Math.sin(up*Math.PI)})"><span><b class="mono" style="margin-right:18px">${up>.5?1:4}º</b>Você</span><span class="mono" style="font-size:40px">${fmt(val)}</span></div>`;
  return `<div style="position:absolute;inset:0;background:radial-gradient(70% 40% at 50% 30%,#ff7a5c,rgba(0,0,0,0) 70%),#ff5f3c"></div>`+
  `<div style="position:absolute;inset:0;transform:scale(${pz}) translateX(${sh}px);transform-origin:50% 40%">`+
  `<div style="position:absolute;left:80px;top:150px;display:flex;gap:14px;align-items:center"><span style="font-family:'Inter Display';font-weight:800;font-size:40px;letter-spacing:-.03em;color:#0b2219">Kairos<b style="color:#f2ede3">.</b></span><span class="mono" style="font-size:23px;letter-spacing:.05em;color:#b9ee4f;background:#0b2219;border-radius:999px;padding:8px 18px">DISPENSA · PREGÃO · COMPRAS.GOV.BR</span></div>`+
  `<div class="L" style="top:262px;font-size:54px;font-weight:700;color:#1a0f0a;letter-spacing:-.01em">Como o Kairos pode te ajudar a</div>`+
  `<div class="L D" style="top:345px;font-size:156px;color:#0b2219">ganhar sua<br>primeira<br><span style="color:#f2ede3">licitação.</span></div>`+
  `<div style="position:absolute;left:44px;right:44px;top:860px;height:${4*H+70}px;border-radius:44px;background:#0b2219;box-shadow:0 50px 100px -30px rgba(0,0,0,.55)"><div class="mono" style="position:absolute;left:66px;top:22px;font-size:22px;letter-spacing:.06em;color:#8fa699">ITEM 1 · CLASSIFICAÇÃO AO VIVO</div><div style="position:absolute;left:0;right:0;top:66px">${rows}</div></div>`+
  `<div class="stamp" style="right:70px;top:780px;font-size:70px;border-color:#b9ee4f;color:#b9ee4f;background:#0b2219;transform:rotate(-6deg) scale(${.4+.6*st});opacity:${st}">1º LUGAR</div>`+
  `<div class="L" style="top:1440px;font-size:24px;color:#1a0f0a;opacity:.75">Exemplo ilustrativo. O Kairos ajuda; o resultado depende da disputa.</div></div>`;
}
const step=(n,l)=>tag(`${n}/4 · ${l}`);
function g2(lt){
  const fab=[['Fabricante A','modelo LX-30','R$ 1.180,00'],['Fabricante B','modelo PX-41','R$ 1.240,00'],['Fabricante C','modelo DM-22','R$ 1.315,00']]; const pick=lt>=2.7, pe=ease((lt-2.7)/.3);
  const inner=sb('19:40')+ttl('Pesquisa de preços','Item 1 · Impressora laser')+`<div style="margin:6px 24px 10px;font-size:14px;color:#8fa699">Fabricantes e preço de referência</div>`+
   fab.map((f,i)=>`<div class="box" style="${fin(lt,.4+i*.35)};border:2px solid ${pick&&i==1?LIME:'#24463a'};display:flex;justify-content:space-between;align-items:center;padding:16px 18px"><div><div style="font-size:17px;font-weight:700">${f[0]}</div><div style="font-size:13.5px;color:#8fa699;margin-top:3px">${f[1]}</div></div><div style="text-align:right"><div class="mono" style="font-size:16px">${f[2]}</div>${pick&&i==1?`<div class="mono" style="font-size:11.5px;color:#0b2219;background:${LIME};border-radius:999px;padding:3px 8px;margin-top:6px;opacity:${pe}">escolhida</div>`:''}</div></div>`).join('')+
   `<div style="margin:18px 24px 0;font-size:14px;color:#8fa699;line-height:1.45">Compare antes de ofertar.</div>`;
  return bg('rgba(185,238,79,.12)')+step(1,'MARCAS')+head(lt,'Escolha a marca<br><span style="color:#b9ee4f">antes de ofertar.</span>',100,270,false)+phone(inner,500,1.06)+
   `<div style="position:absolute;left:70px;right:70px;top:1150px;border-radius:30px;background:#f2ede3;color:#0b2219;padding:26px 30px;transform:rotate(-1.5deg) scale(${.92+.08*back((lt-1.5)/.3)});opacity:${clamp((lt-1.5)/.12)};box-shadow:0 30px 60px -20px rgba(0,0,0,.6)"><div class="mono" style="font-size:19px;letter-spacing:.05em;color:#56645b">TRECHO DO EDITAL · ITEM 1</div><div style="font-size:31px;font-weight:700;margin-top:10px;line-height:1.3">Impressora laser, frente e verso,<br>mínimo de 30 páginas por minuto.</div><div style="margin-top:16px;border-radius:18px;padding:12px 18px;font-size:27px;font-weight:800;background:${pick?'#b9ee4f':'#e3dccd'};color:#0b2219">${pick?'✓ Fabricante B atende. É essa que você oferta.':'Qual fabricante atende?'}</div></div>`+
   note('Ex.: o Kairos mostra fabricantes e preços; você compara com o edital<br>e oferta o modelo que atende. Valores de exemplo.',1490);
}
function g3(lt){
  const ren=lt>=3.0, re=ease((lt-3.0)/.3);
  const docs=[['CND Federal','válida até 12/12',LIME],['CRF · FGTS',ren?'renovada · válida até 27/11':'vence em 3 dias',ren?LIME:CORAL],['CNDT Trabalhista','válida até 03/01',LIME],['Contrato social','em dia',LIME]];
  const inner=sb('19:42')+ttl('Documentos','Validade de cada um')+docs.map((d,i)=>{const warn=i==1&&!ren;return `<div class="box" style="${fin(lt,.35+i*.25)};border:2px solid ${warn?CORAL:i==1&&ren?LIME:'#24463a'};display:flex;justify-content:space-between;align-items:center;padding:16px 18px;transform:scale(${warn?1+.02*Math.sin(lt*9):1})"><span style="font-size:17px;font-weight:700">${d[0]}</span><span class="mono" style="font-size:12.5px;color:${d[2]}">${d[1]}</span></div>`}).join('')+
   `<div style="margin:22px 16px;border-radius:22px;padding:18px 22px;background:#1b3a2d;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:18px;${fin(lt,1.6)}"><span>Baixar tudo em ZIP</span><span class="mono" style="color:${LIME}">↓ .zip</span></div>`;
  return bg('rgba(255,95,60,.12)')+step(2,'DOCUMENTOS')+head(lt,'Nenhum documento<br><span style="color:#b9ee4f">vencido no dia.</span>',100,270,false)+phone(inner,500,1.06)+
   note('Ex.: o FGTS vence em 3 dias e você renova antes da disputa.<br>Datas de exemplo.',1490);
}
function g4(lt){
  const A=2.6; const inner=lt<A?cfgScreen(lt,'08:51','R$ 1.250,00',['Item 1','Impressora laser · disputa hoje']):roboScreen(lt-A,{t0:.25,R:1.0,comp:[1301.00,1289.90,1279.90,1268.80],stop:1250,me0:1312.30,cp0:1312.40,tm:'08:59'});
  return bg('rgba(185,238,79,.16)')+step(3,'DISPUTA')+head(lt,'No dia da disputa,<br><span style="color:#b9ee4f">o robô cobre em<br>milissegundos.</span>',92,270,false)+phone(inner,590,1.0)+
   note('Configurado no dia da disputa. Cobre só acima do seu stop loss.<br>Roda no servidor e você opera pelo celular. Valores de exemplo.',1490);
}
function g5(lt){
  const L=[['Dispensa 90012/2026','abre hoje · 14h','#f2ede3','#24463a'],['Pregão 15/2026','● ganhando',LIME,'#24463a'],['Pregão 22/2026','● perdendo','#ff8a6d','#5a2e22']];
  const inner=sb('09:30')+ttl('Meus leilões','Hoje · 3 disputas')+L.map((l,i)=>`<div class="box" style="${fin(lt,.35+i*.3)};border-color:${l[3]};display:flex;justify-content:space-between;align-items:center;padding:16px 18px"><span style="font-size:16px;font-weight:700">${l[0]}</span><span class="mono" style="font-size:12.5px;color:${l[2]}">${l[1]}</span></div>`).join('')+
   `<div style="margin:16px 24px 8px;font-size:15px;font-weight:700;${fin(lt,1.4)}">Itens da compra · Pregão 15</div>
   <div style="margin:0 16px;display:flex;flex-direction:column;gap:7px;${fin(lt,1.6)}"><div class="row"><span class="tx">Item 1 · Impressora laser</span>${pill('ganhando',LIME)}</div><div class="row"><span class="tx">Item 2 · Monitor 24"</span>${pill('ganhando',LIME)}</div></div>
   <div style="margin:16px 24px 8px;font-size:15px;font-weight:700;${fin(lt,2.0)}">Log de atividades</div>
   <div style="margin:0 16px;display:flex;flex-direction:column;gap:7px;${fin(lt,2.2)}"><div class="row"><span class="tm">09:01:12</span><span class="tx">Cobriu: R$ 1.268,80 → R$ 1.268,70</span></div><div class="row"><span class="tm">08:59:52</span><span class="tx">Robô ligado · item 1</span></div></div>`;
  return bg('rgba(185,238,79,.12)')+step(4,'INFORMAÇÃO')+head(lt,'Tudo da disputa<br><span style="color:#b9ee4f">em um só lugar.</span>',100,270,false)+phone(inner,500,1.06)+
   note('Ex.: três disputas no mesmo dia, cada uma com status, itens e histórico.<br>Valores de exemplo.',1490);
}
function g6(lt,boost){
  const p=1+.03*Math.sin(lt*6);
  const main=boost?'Siga o Kairos':'Comenta PREGÃO', sec=boost?'Comenta PREGÃO':'';
  return bg('rgba(255,95,60,.22)')+tag('DISPENSA · PREGÃO · COMPRAS.GOV.BR')+head(lt,'Do preparo<br>à disputa,<br><span style="color:#b9ee4f">com você.</span>',130,270,false)+`
  <div class="L" style="top:680px;font-size:40px;line-height:1.45;color:#cfd8cf;opacity:${ease((lt-.35)/.3)}">Do primeiro edital ao último lance,<br>tudo controlado pelo celular.</div>
  <div style="position:absolute;left:80px;top:880px;background:#ff5f3c;color:#0b2219;border-radius:36px;padding:34px 50px;font-family:'Inter Display';font-weight:900;font-size:88px;letter-spacing:-.03em;transform:scale(${p*(.8+.2*back((lt-.6)/.3))});transform-origin:left center;opacity:${clamp((lt-.6)/.1)}">${main}</div>`+
  (boost?`<div style="position:absolute;left:80px;top:1090px;border:3px solid #f1ede4;border-radius:30px;padding:20px 34px;font-family:'Inter Display';font-weight:800;font-size:54px;opacity:${ease((lt-1.0)/.3)}">${sec}</div>`
        :`<div class="L" style="top:1095px;font-size:38px;color:#cfd8cf;opacity:${ease((lt-.9)/.3)}">e receba o Kit do Pregão no Direct.</div>`)+
